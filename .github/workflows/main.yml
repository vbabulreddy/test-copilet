#crate an end to end pipeline for a simple python application
#the pipeline will have the following stages:
# 1. Build
# 2. Test
# 3. Deploy 
#the pipeline will be triggered on every push to the main branch
name: Python Application Pipeline
on:
  push:
    branches:
      - main  
jobs:
  build:    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
